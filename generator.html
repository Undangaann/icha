<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Pesan & Link Undangan - Arief & Icha</title>
    <!-- Menggunakan Bootstrap 5 untuk tampilan yang rapi dan responsif -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 12px;
        }
        .preview-box {
            background: #fdfbf7;
            border: 1px dashed #d1c7bd;
            border-radius: 8px;
            white-space: pre-wrap;
            font-size: 0.95rem;
            color: #333;
        }
    </style>
</head>
<body class="py-5">

    <div class="container" style="max-width: 650px;">
        <div class="card shadow-sm p-4 p-md-5">
            <h3 class="text-center mb-1 fw-bold" style="color: #6b5b4e;">Generator Undangan</h3>
            <p class="text-center text-muted mb-4">Arief & Icha Wedding</p>
            
            <!-- Input Nama Tamu -->
            <div class="mb-3">
                <label for="guestName" class="form-label fw-semibold">Nama Tamu Undangan:</label>
                <input type="text" id="guestName" class="form-control form-control-lg" placeholder="Contoh: Bapak Asnan & Nyonya" oninput="generateMessage()">
                <div class="form-text">Ketik nama tamu di atas, pesan dan link akan otomatis terbuat di bawah.</div>
            </div>

            <hr class="my-4">

            <!-- Hasil Preview & Tombol Aksi -->
            <div id="resultSection">
                <label class="form-label fw-semibold">Preview Pesan :</label>
                <div id="messagePreview" class="preview-box p-3 mb-3"></div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button class="btn btn-outline-secondary me-md-2" onclick="copyMessage()">
                        <i class="fa-solid fa-copy"></i> Salin Pesan
                    </button>
                    <a id="waButton" href="#" target="_blank" class="btn btn-success">
                        <i class="fa-brands fa-whatsapp"></i> Kirim via WhatsApp
                    </a>
                </div>
            </div>
        </div>
        <p class="text-center text-muted mt-3 small">&copy; 2026 Arief & Icha Wedding</p>
    </div>

    <script>
        function generateMessage() {
            let name = document.getElementById('guestName').value.trim();
            if (!name) {
                name = "[Nama Tamu]";
            }

            // URL Website Undangan Anda di GitHub Pages
            const baseUrl = "https://undangaann.github.io/icha/";
            const finalLink = baseUrl + "?to=" + encodeURIComponent(name);

            // Template Pesan Sesuai Permintaan Anda
            const message = `Assalamu’alaikum Warahmatullahi Wabarakatuh,

Dengan penuh kebahagiaan, kami ingin mengundang ${name} untuk hadir dan menjadi bagian dari hari istimewa pernikahan kami. 🤍

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir serta memberikan doa dan restu.

💍 Arief & Icha

Untuk detail acara, waktu, dan lokasi, silakan buka undangan pernikahan kami melalui tautan berikut:

🔗 ${finalLink}

Mohon maaf apabila undangan ini disampaikan melalui pesan singkat.

Terima kasih atas doa, perhatian, dan kasih sayangnya. 🙏🏻

Wassalamu’alaikum Warahmatullahi Wabarakatuh.`;

            // Tampilkan ke elemen preview
            document.getElementById('messagePreview').textContent = message;

            // Set link tombol WhatsApp
            const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            document.getElementById('waButton').href = waUrl;
        }

        function copyMessage() {
            const previewText = document.getElementById('messagePreview').textContent;
            navigator.clipboard.writeText(previewText).then(() => {
                alert('Pesan berhasil disalin ke clipboard!');
            });
        }

        // Jalankan saat pertama kali muat
        generateMessage();
    </script>
</body>
</html>
